<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>業務獵人</title>
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px; /* 手機版邊距 */
            /* 防止手機下拉刷新破壞體驗 */
            overscroll-behavior-y: none; 
            -webkit-user-select: none; /* 禁止選取文字 */
            user-select: none;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 380px; /* 適配手機寬度 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        /* 角色區域 */
        .character-frame {
            width: 180px;
            height: 180px;
            margin: 10px auto 20px;
            border: 4px solid #FFD700;
            border-radius: 50%;
            overflow: hidden;
            background-color: #333;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .character-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rank-badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.1em;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4);
            letter-spacing: 1px;
        }

        /* 數據顯示 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 15px;
        }

        .stat-item h3 { margin: 0; font-size: 1.8em; color: #4cd137; text-shadow: 0 0 10px rgba(76, 209, 55, 0.3); }
        .stat-item p { margin: 5px 0 0; font-size: 0.9em; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        /* 進度條 */
        .progress-container {
            background-color: #333;
            border-radius: 10px;
            height: 24px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
            border: 1px solid #444;
        }

        .progress-bar {
            background: linear-gradient(90deg, #00a8ff, #9c88ff);
            height: 100%;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            position: absolute;
            top: 0;
            width: 100%;
            text-align: center;
            line-height: 24px;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 2;
        }

        /* 操作按鈕區 */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 18px 10px; /* 增加觸控範圍 */
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation; /* 優化觸控反應 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, filter 0.1s;
        }

        .btn:active { transform: scale(0.96); filter: brightness(0.9); }
        
        /* 顏色配置 */
        .btn-explore { background: linear-gradient(to bottom right, #34495e, #2c3e50); }
        .btn-defend { background: linear-gradient(to bottom right, #e67e22, #d35400); border: 2px solid #ffcc00; } /* 特別強調 */
        .btn-target { background: linear-gradient(to bottom right, #27ae60, #2ecc71); }
        .btn-contract { background: linear-gradient(to bottom right, #8e44ad, #9b59b6); }
        .btn-dungeon { 
            grid-column: span 2; 
            background: linear-gradient(45deg, #c0392b, #e74c3c); 
            font-size: 1.2em;
            padding: 20px;
        }

        .xp-tag { font-size: 0.75em; opacity: 0.9; margin-top: 4px; font-weight: normal; }

        .reset-btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid #444;
            color: #666;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8em;
        }

        /* 模態視窗特效 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            animation: fadeIn 0.3s;
        }
        
        .modal h2 { color: #FFD700; font-size: 2.5em; margin: 20px 0; text-shadow: 0 0 30px #FFD700; }
        .modal p { font-size: 1.3em; margin-bottom: 30px; padding: 0 20px; line-height: 1.5; }
        
        .close-modal {
            padding: 12px 40px;
            background: #FFD700;
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.2em;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        /* 動畫 */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes evolutionShake {
            0% { transform: translate(0, 0) rotate(0deg); filter: brightness(1); }
            25% { transform: translate(-2px, 2px) rotate(-1deg); filter: brightness(1.5); }
            50% { transform: translate(2px, -2px) rotate(1deg); filter: brightness(2); }
            75% { transform: translate(-2px, -2px) rotate(-1deg); filter: brightness(4); }
            100% { transform: translate(0, 0) rotate(0deg); filter: brightness(5); }
        }
        .evolving { animation: evolutionShake 2s ease-in-out forwards; }

    </style>
</head>
<body>

    <div class="game-container">
        <div class="rank-badge" id="rankBadge">見習獵人 I</div>
        
        <div class="character-frame" id="charFrame">
            <img src="level1.jpg" alt="角色" class="character-img" id="charImg" onerror="this.src='https://ui-avatars.com/api/?name=Hunter&background=random&color=fff&size=256'">
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <h3 id="currentXP">0</h3>
                <p>總 XP</p>
            </div>
            <div class="stat-item">
                <h3 id="dailyXP">0</h3>
                <p>今日戰果</p>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">載入中...</div>
        </div>

        <div class="actions">
            <button class="btn btn-explore" onclick="addXP(10)">
                👋 探索
                <span class="xp-tag">+10 XP</span>
            </button>
            <button class="btn btn-defend" onclick="addXP(30)">
                🛡️ 防禦 (被拒)
                <span class="xp-tag">+30 XP</span>
            </button>
            <button class="btn btn-target" onclick="addXP(50)">
                📱 鎖定 (Line)
                <span class="xp-tag">+50 XP</span>
            </button>
            <button class="btn btn-contract" onclick="addXP(150)">
                📜 契約 (預約)
                <span class="xp-tag">+150 XP</span>
            </button>
            <button class="btn btn-dungeon" onclick="addXP(400)">
                🏪 超商副本 (建檔)
                <span class="xp-tag">CRITICAL! +400</span>
            </button>
        </div>

        <div style="margin-top: 20px;">
            <button class="reset-btn" onclick="resetDay()">🔄 重置今日</button>
            <button class="reset-btn" onclick="resetAll()" style="color:#d63031; border-color: #d63031;">⚠️ 刪檔重練</button>
        </div>
    </div>

    <div class="modal" id="evoModal">
        <h2 id="evoTitle">EVOLUTION!</h2>
        <p id="evoDesc">恭喜你突破界限！</p>
        <button class="close-modal" onclick="closeModal()">繼續旅程</button>
    </div>

    <script>
        // --- 遊戲核心邏輯 ---
        let gameState = {
            totalXP: 0,
            dailyXP: 0,
            level: 1,
            lastLogin: new Date().toDateString()
        };

        // 職階設定
        const thresholds = {
            1: { xp: 1000, title: "見習獵人", img: "level1.jpg" },
            2: { xp: 5000, title: "資深獵人", img: "level2.jpg" },
            3: { xp: 10000, title: "傳說大師", img: "level3.jpg" },
            4: { xp: 9999999, title: "保險之神", img: "level3.jpg" }
        };

        function init() {
            const saved = localStorage.getItem('salesRPG_save');
            if (saved) {
                gameState = JSON.parse(saved);
            }
            // 每日重置檢查
            if (gameState.lastLogin !== new Date().toDateString()) {
                gameState.dailyXP = 0;
                gameState.lastLogin = new Date().toDateString();
                saveGame();
            }
            updateUI();
        }

        function addXP(amount) {
            gameState.totalXP += amount;
            gameState.dailyXP += amount;
            
            // 觸覺回饋 (手機震動)
            if (navigator.vibrate) navigator.vibrate(50); 
            
            checkLevelUp();
            saveGame();
            updateUI();
        }

        function checkLevelUp() {
            let nextLevel = 1;
            if (gameState.totalXP >= 1000) nextLevel = 2;
            if (gameState.totalXP >= 5000) nextLevel = 3;
            // 可在此增加更多等級

            if (nextLevel > gameState.level) {
                gameState.level = nextLevel;
                triggerEvolution(nextLevel);
            }
        }

        function triggerEvolution(newLevel) {
            const frame = document.getElementById('charFrame');
            frame.classList.add('evolving'); // 播放動畫
            
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]); // 長震動

            setTimeout(() => {
                frame.classList.remove('evolving');
                
                const modal = document.getElementById('evoModal');
                document.getElementById('evoTitle').innerText = "職階晉升！";
                document.getElementById('evoDesc').innerText = `恭喜達成 ${gameState.totalXP} XP\n你現在是：${thresholds[newLevel].title}`;
                modal.style.display = 'flex';
                
                updateUI(); // 更新圖片
            }, 2000);
        }

        function updateUI() {
            // 數據更新
            document.getElementById('currentXP').innerText = gameState.totalXP;
            document.getElementById('dailyXP').innerText = gameState.dailyXP;

            // 職階判定
            let currentRank = thresholds[1];
            let nextXP = thresholds[1].xp;
            
            if (gameState.level >= 2) { currentRank = thresholds[2]; nextXP = thresholds[2].xp; }
            if (gameState.level >= 3) { currentRank = thresholds[3]; nextXP = thresholds[3].xp; }

            document.getElementById('rankBadge').innerText = `${currentRank.title} (Lv.${gameState.level})`;

            // 圖片更新 (只有在非動畫狀態下才更新，避免閃爍)
            const img = document.getElementById('charImg');
            if (!document.getElementById('charFrame').classList.contains('evolving')) {
                if (!img.src.includes(currentRank.img)) {
                    img.src = currentRank.img;
                }
            }

            // 進度條計算
            let prevXP = 0;
            if (gameState.level === 2) prevXP = 1000;
            if (gameState.level === 3) prevXP = 5000;
            
            let percentage = 0;
            if (gameState.level < 3) {
                percentage = ((gameState.totalXP - prevXP) / (nextXP - prevXP)) * 100;
                document.getElementById('progressText').innerText = `下階還需: ${nextXP - gameState.totalXP} XP`;
            } else {
                percentage = 100;
                document.getElementById('progressText').innerText = "MAX LEVEL";
            }
            document.getElementById('progressBar').style.width = Math.min(percentage, 100) + '%';
        }

        function saveGame() {
            localStorage.setItem('salesRPG_save', JSON.stringify(gameState));
        }

        function resetDay() {
            if(confirm('重置今日戰果？(總分保留)')) {
                gameState.dailyXP = 0;
                updateUI();
                saveGame();
            }
        }

        function resetAll() {
            if(confirm('【警告】確定要刪除所有進度重練嗎？')) {
                localStorage.removeItem('salesRPG_save');
                location.reload();
            }
        }

        function closeModal() {
            document.getElementById('evoModal').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
