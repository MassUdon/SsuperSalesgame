<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>業務獵人：數據戰場</title>
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --highlight: #FFD700;
            --danger: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px;
            user-select: none; -webkit-user-select: none;
            overscroll-behavior-y: none;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        /* 狀態列 */
        .buff-bar {
            display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-bottom: 10px;
        }
        .buff-badge {
            font-size: 0.75em; padding: 4px 8px; border-radius: 12px;
            background: #333; border: 1px solid #555; color: #aaa;
            display: flex; align-items: center; gap: 4px;
        }
        .buff-active {
            background: rgba(255, 215, 0, 0.15); border-color: var(--highlight);
            color: var(--highlight); box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
        }

        /* 角色區域 */
        .character-frame {
            width: 140px; height: 140px; margin: 5px auto 10px;
            border: 4px solid var(--highlight); border-radius: 50%;
            overflow: hidden; background-color: #333;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); position: relative;
        }
        .character-img { width: 100%; height: 100%; object-fit: cover; }

        .rank-badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000; padding: 4px 12px; border-radius: 50px;
            font-weight: 800; font-size: 0.9em; display: inline-block; margin-bottom: 5px;
        }

        /* 數據顯示 */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-bottom: 15px; background: rgba(255,255,255,0.05);
            padding: 10px; border-radius: 15px;
        }
        .stat-item h3 { margin: 0; font-size: 1.5em; color: #4cd137; }
        .stat-item p { margin: 2px 0 0; font-size: 0.8em; color: #aaa; }

        /* 進度條 */
        .progress-container {
            background-color: #333; border-radius: 10px; height: 18px;
            width: 100%; margin-bottom: 15px; overflow: hidden; position: relative; border: 1px solid #444;
        }
        .progress-bar {
            background: linear-gradient(90deg, #00a8ff, #9c88ff);
            height: 100%; width: 0%; transition: width 0.5s ease;
        }
        .progress-text {
            position: absolute; top: 0; width: 100%; text-align: center;
            line-height: 18px; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 2;
        }

        /* 按鈕區 */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn {
            border: none; padding: 12px 5px; border-radius: 10px;
            font-size: 0.9em; font-weight: bold; cursor: pointer; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            touch-action: manipulation; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-explore { background: linear-gradient(to bottom right, #34495e, #2c3e50); }
        .btn-defend { background: linear-gradient(to bottom right, #7f8c8d, #95a5a6); border: 1px solid #bdc3c7; }
        .btn-target { background: linear-gradient(to bottom right, #27ae60, #2ecc71); }
        .btn-contract { background: linear-gradient(to bottom right, #8e44ad, #9b59b6); }
        .btn-dungeon { grid-column: span 2; background: linear-gradient(45deg, #c0392b, #e74c3c); font-size: 1.1em; padding: 12px; }
        .btn-recruit { 
            grid-column: span 2; background: linear-gradient(135deg, #FDC830, #F37335); 
            border: 2px solid #fff; color: #000; font-size: 1.1em; 
            padding: 12px; box-shadow: 0 0 10px rgba(243, 115, 53, 0.4);
        }

        .xp-tag { font-size: 0.7em; opacity: 0.9; margin-top: 3px; font-weight: normal; }

        /* 功能按鈕 */
        .utility-btns {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            margin-top: 20px; padding-top: 15px; border-top: 1px solid #333;
        }
        .util-btn {
            background: transparent; border: 1px solid #555; color: #888;
            padding: 8px 10px; border-radius: 10px; font-size: 0.85em; cursor: pointer;
        }
        .report-btn {
            grid-column: span 2; background: linear-gradient(90deg, #f39c12, #d35400);
            color: white; border: none; font-weight: bold; font-size: 1em;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
        }

        /* 模態視窗 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000;
            justify-content: center; align-items: center; flex-direction: column; text-align: center;
            padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .modal h2 { color: #FFD700; font-size: 1.8em; margin: 10px 0; }
        
        .list-card { background: #2d2d2d; border-radius: 15px; padding: 15px; width: 100%; max-width: 350px; text-align: left; margin-bottom: 15px; border: 1px solid #444; }
        .list-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .list-row:last-child { border: none; margin-bottom: 0; }
        .list-label { color: #aaa; font-size: 0.9em; }
        .list-val { color: #fff; font-weight: bold; }
        
        .ach-item { background: linear-gradient(90deg, #2c3e50, transparent); padding: 6px 10px; margin-bottom: 4px; border-left: 3px solid #FFD700; color: #ecf0f1; font-size: 0.85em; }
        .ore-star { border-color: #9b59b6; box-shadow: 0 0 5px #9b59b6; }
        .close-btn { padding: 10px 30px; background: #FFD700; color: #000; border: none; border-radius: 30px; font-weight: 900; margin-top: 10px; cursor: pointer; }
        .season-end-btn { background: linear-gradient(90deg, #c0392b, #e74c3c); color: white; box-shadow: 0 0 15px rgba(231, 76, 60, 0.5); padding: 15px 40px; font-size: 1.2em; border: 2px solid #fff; }

        .evolving { animation: evolutionShake 2s ease-in-out forwards; }
        @keyframes evolutionShake { 0% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.1); filter: brightness(2); } 100% { transform: scale(1); filter: brightness(5); } }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="buff-bar">
            <div id="buff-weather" class="buff-badge" onclick="refreshWeather()">📡 氣象</div>
            <div id="buff-time" class="buff-badge">🕐 午日行者</div>
            <div id="buff-streak" class="buff-badge">🔥 連勝: 0天</div>
        </div>

        <div class="rank-badge" id="rankBadge">載入中...</div>
        
        <div class="character-frame" id="charFrame">
            <img src="level1.jpg" alt="角色" class="character-img" id="charImg" onerror="this.src='https://ui-avatars.com/api/?name=Soldier&background=random'">
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <h3 id="currentXP">0</h3>
                <p>總 XP</p>
            </div>
            <div class="stat-item">
                <h3 id="dailyXP">0</h3>
                <p>今日戰果</p>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">載入中...</div>
        </div>

        <div class="actions">
            <button class="btn btn-explore" onclick="handleAction('explore', 10)">
                👋 探索 <span class="xp-tag" id="xp-10">+10 XP</span>
            </button>
            <button class="btn btn-defend" onclick="handleAction('block', 30)">
                🛡️ 格檔 <span class="xp-tag" id="xp-30">+30 XP</span>
            </button>
            <button class="btn btn-target" onclick="handleAction('target', 50)">
                📱 鎖定 <span class="xp-tag" id="xp-50">+50 XP</span>
            </button>
            <button class="btn btn-contract" onclick="handleAction('contract', 150)">
                📜 契約 <span class="xp-tag" id="xp-150">+150 XP</span>
            </button>
            <button class="btn btn-dungeon" onclick="handleAction('dungeon', 400)">
                🏪 超商副本 <span class="xp-tag" id="xp-400">CRIT +400</span>
            </button>
            <button class="btn btn-recruit" onclick="handleRecruit()">
                💎 邀約面談 <span class="xp-tag" id="xp-4000" style="color:#000; font-weight:bold;">LEGEND +4000</span>
            </button>
        </div>

        <div class="utility-btns">
            <button class="util-btn report-btn" onclick="showSettlement()">📊 今日結算 (存檔)</button>
            <button class="util-btn" onclick="showLifetimeStats()">🏆 生涯統計</button>
            <button class="util-btn undo-btn" onclick="undoLastAction()">↩️ 復原</button>
            <button class="util-btn" onclick="requestReset()" style="color:#d63031; border-color: #d63031;">⚠️ 刪檔重來</button>
        </div>
    </div>

    <div class="modal" id="reportModal">
        <h2>今日戰報</h2>
        <div class="list-card">
            <div class="list-row"><span class="list-label">👋 探索</span><span class="list-val" id="rep-explore">0</span></div>
            <div class="list-row"><span class="list-label">🛡️ 格檔</span><span class="list-val" id="rep-block">0</span></div>
            <div class="list-row"><span class="list-label">📱 鎖定</span><span class="list-val" id="rep-target">0</span></div>
            <div class="list-row"><span class="list-label">📜 契約</span><span class="list-val" id="rep-contract">0</span></div>
            <div class="list-row"><span class="list-label">🏪 副本</span><span class="list-val" id="rep-dungeon">0</span></div>
            <div class="list-row"><span class="list-label">💎 增員</span><span class="list-val" id="rep-recruit">0</span></div>
            <div class="list-row" style="border-top:1px dashed #555; margin-top:5px; padding-top:5px;">
                <span class="list-label">✨ 今日XP</span><span class="list-val" id="rep-xp">0</span>
            </div>
            <div class="list-row">
                <span class="list-label">🔥 連勝判定</span><span class="list-val" id="rep-streak-status">...</span>
            </div>
        </div>
        <h3>🏅 今日成就</h3>
        <div class="list-card" id="achList" style="max-height:150px; overflow-y:auto;"></div>
        <button class="close-btn" onclick="resetDayAndClose()">開啟新的一天</button>
        <button style="background:transparent; color:#888; border:none; margin-top:10px; text-decoration:underline;" onclick="document.getElementById('reportModal').style.display='none'">關閉</button>
    </div>

    <div class="modal" id="statsModal">
        <h2>🏆 生涯榮譽榜</h2>
        <div class="list-card" id="lifetimeList" style="max-height:60vh; overflow-y:auto;"></div>
        <button class="close-btn" onclick="document.getElementById('statsModal').style.display='none'">關閉</button>
    </div>

    <div class="modal" id="seasonEndModal" style="background: rgba(20, 5, 5, 0.98);">
        <h2 style="color: #e74c3c; font-size: 2.2em; text-shadow: 0 0 20px red;">🏆 賽季總結算</h2>
        <p style="color: #aaa;">本賽季最終成績單</p>
        
        <div class="list-card" style="border-color: #e74c3c; box-shadow: 0 0 15px rgba(231, 76, 60, 0.2);">
            <div class="list-row" style="border-bottom: 2px solid #555; margin-bottom: 10px;">
                <span class="list-label">📅 賽季期間</span><span class="list-val" id="season-date-range" style="font-size:0.9em; color:#FFD700;">-</span>
            </div>
            <div class="list-row"><span class="list-label">🛡️ 最終軍階</span><span class="list-val" id="season-rank" style="color:#FFD700; font-size:1.1em;">-</span></div>
            <div class="list-row"><span class="list-label">✨ 累積總 XP</span><span class="list-val" id="season-xp">-</span></div>
            <div class="list-row"><span class="list-label">🔥 最高連勝</span><span class="list-val" id="season-streak">-</span></div>
        </div>

        <h3>📊 賽季行動總表</h3>
        <div class="list-card" style="border: 1px solid #555;">
            <div class="list-row"><span class="list-label">👋 探索總數</span><span class="list-val" id="season-explore">0</span></div>
            <div class="list-row"><span class="list-label">🛡️ 格檔總數</span><span class="list-val" id="season-block">0</span></div>
            <div class="list-row"><span class="list-label">📱 鎖定總數</span><span class="list-val" id="season-target">0</span></div>
            <div class="list-row"><span class="list-label">📜 契約總數</span><span class="list-val" id="season-contract">0</span></div>
            <div class="list-row"><span class="list-label">🏪 副本總數</span><span class="list-val" id="season-dungeon">0</span></div>
            <div class="list-row"><span class="list-label">💎 增員總數</span><span class="list-val" id="season-recruit">0</span></div>
        </div>

        <h3>🏅 生涯成就統計</h3>
        <div class="list-card" id="seasonAchList" style="max-height:150px; overflow-y:auto; border: 1px solid #555;"></div>
        
        <p style="color: #d63031; font-weight: bold; margin-top: 10px;">⚠️ 確認後將開啟新賽季（數據歸零）</p>
        <button class="close-btn season-end-btn" onclick="finalWipe()">確認開啟新賽季</button>
        <button style="background:transparent; color:#888; border:none; margin-top:15px; text-decoration:underline;" onclick="document.getElementById('seasonEndModal').style.display='none'">再等一下 (取消)</button>
    </div>

    <div class="modal" id="evoModal">
        <h2 id="evoTitle">晉升！</h2>
        <p id="evoDesc">恭喜獲得新軍階！</p>
        <button class="close-btn" onclick="document.getElementById('evoModal').style.display='none'">繼續</button>
    </div>

    <script>
        // --- 核心變數與 15 階級設定 ---
        const thresholds = {
            1: { xp: 500, title: "新人 (Lv.1)", img: "level1.jpg" },
            2: { xp: 1200, title: "二等兵 (Lv.2)", img: "level2.jpg" },
            3: { xp: 2500, title: "一等兵 (Lv.3)", img: "level3.jpg" },
            4: { xp: 4500, title: "上等兵 (Lv.4)", img: "level4.jpg" },
            5: { xp: 7000, title: "下士 (Lv.5)", img: "level5.jpg" },
            6: { xp: 10000, title: "中士 (Lv.6)", img: "level6.jpg" },
            7: { xp: 15000, title: "上士 (Lv.7)", img: "level7.jpg" },
            8: { xp: 22000, title: "三等士官長 (Lv.8)", img: "level8.jpg" },
            9: { xp: 30000, title: "二等士官長 (Lv.9)", img: "level9.jpg" },
            10: { xp: 40000, title: "一等士官長 (Lv.10)", img: "level10.jpg" },
            11: { xp: 55000, title: "准尉 (Lv.11)", img: "level11.jpg" },
            12: { xp: 75000, title: "少尉 (Lv.12)", img: "level12.jpg" },
            13: { xp: 100000, title: "中尉 (Lv.13)", img: "level13.jpg" },
            14: { xp: 150000, title: "上尉 (Lv.14)", img: "level14.jpg" },
            15: { xp: 9999999, title: "王牌上尉 (MAX)", img: "level15.jpg" }
        };

        let gameState = {
            totalXP: 0,
            dailyXP: 0,
            level: 1,
            lastLogin: new Date().toDateString(),
            seasonStartDate: new Date().toLocaleDateString(),
            streakDays: 0,
            dailyStats: { explore: 0, block: 0, target: 0, contract: 0, dungeon: 0, recruit: 0, currentStreak: 0, maxStreak: 0 },
            // 新增: 賽季統計數據 (累積用)
            seasonStats: { explore: 0, block: 0, target: 0, contract: 0, dungeon: 0, recruit: 0 },
            lifetimeStats: {}
        };
        
        let weatherMultiplier = 0;
        let timeMultiplier = 0;
        let streakMultiplier = 0;
        let historyStack = [];

        function init() {
            const saved = localStorage.getItem('salesRPG_v7_save'); // v7 存檔
            if (saved) {
                gameState = JSON.parse(saved);
                if (typeof gameState.streakDays === 'undefined') gameState.streakDays = 0;
                if (!gameState.lifetimeStats) gameState.lifetimeStats = {};
                if (!gameState.seasonStartDate) gameState.seasonStartDate = new Date().toLocaleDateString();
                // 兼容性檢查：初始化賽季統計
                if (!gameState.seasonStats) {
                    gameState.seasonStats = { explore: 0, block: 0, target: 0, contract: 0, dungeon: 0, recruit: 0 };
                }
            } else {
                gameState.seasonStartDate = new Date().toLocaleDateString();
                gameState.seasonStats = { explore: 0, block: 0, target: 0, contract: 0, dungeon: 0, recruit: 0 };
            }

            if (gameState.lastLogin !== new Date().toDateString()) {
                resetDailyStats();
                gameState.lastLogin = new Date().toDateString();
                saveGame();
            }
            
            checkTimeBonus();
            calculateMultipliers();
            updateUI();
            initWeather();
            setInterval(checkTimeBonus, 60000);
        }

        function resetDailyStats() {
            gameState.dailyXP = 0;
            gameState.dailyStats = { explore: 0, block: 0, target: 0, contract: 0, dungeon: 0, recruit: 0, currentStreak: 0, maxStreak: 0 };
        }

        function checkTimeBonus() {
            const hour = new Date().getHours();
            const badge = document.getElementById('buff-time');
            if (hour >= 14 && hour < 17) {
                timeMultiplier = 0.1; badge.classList.add('buff-active'); badge.innerText = "🕐 午日行者 (+10%)";
            } else {
                timeMultiplier = 0; badge.classList.remove('buff-active'); badge.innerText = "🕐 午日行者";
            }
            calculateMultipliers();
        }

        function calculateMultipliers() {
            if (gameState.streakDays >= 2) {
                let bonus = (gameState.streakDays - 1) * 0.05;
                if (bonus > 0.30) bonus = 0.30;
                streakMultiplier = bonus;
            } else { streakMultiplier = 0; }
            
            const sBadge = document.getElementById('buff-streak');
            if (streakMultiplier > 0) {
                sBadge.classList.add('buff-active'); sBadge.innerText = `🔥 連勝 ${gameState.streakDays}天 (+${Math.round(streakMultiplier*100)}%)`;
            } else {
                sBadge.classList.remove('buff-active'); sBadge.innerText = `🔥 連勝: ${gameState.streakDays}天`;
            }
            updateButtonLabels();
        }

        function handleAction(type, baseXP) {
            historyStack.push(JSON.parse(JSON.stringify(gameState)));
            if (historyStack.length > 10) historyStack.shift();
            gameState.dailyStats[type]++;

            if (['target', 'contract', 'dungeon', 'recruit'].includes(type)) {
                gameState.dailyStats.currentStreak++;
                if (gameState.dailyStats.currentStreak > gameState.dailyStats.maxStreak) gameState.dailyStats.maxStreak = gameState.dailyStats.currentStreak;
            } else if (type === 'block') { gameState.dailyStats.currentStreak = 0; }

            const totalMult = 1 + weatherMultiplier + timeMultiplier + streakMultiplier;
            const finalAmount = Math.floor(baseXP * totalMult);
            gameState.totalXP += finalAmount;
            gameState.dailyXP += finalAmount;
            if (navigator.vibrate) navigator.vibrate(50);
            
            checkLevelUp();
            saveGame();
            updateUI();
        }

        function handleRecruit() { if(confirm("恭喜成功邀約！\n確認領取 4000 XP？")) handleAction('recruit', 4000); }

        function checkLevelUp() {
            let nextLevel = gameState.level;
            for (let i = gameState.level; i < 15; i++) {
                if (gameState.totalXP >= thresholds[i].xp) nextLevel = i + 1;
            }
            
            if (nextLevel > gameState.level) {
                gameState.level = nextLevel;
                document.getElementById('evoModal').style.display = 'flex';
                document.getElementById('evoDesc').innerText = `晉升為：${thresholds[nextLevel].title}`;
                document.getElementById('charFrame').classList.add('evolving');
                setTimeout(() => document.getElementById('charFrame').classList.remove('evolving'), 2000);
            }
        }

        function updateUI() {
            document.getElementById('currentXP').innerText = gameState.totalXP;
            document.getElementById('dailyXP').innerText = gameState.dailyXP;
            
            let currentData = thresholds[gameState.level] || thresholds[1];
            document.getElementById('rankBadge').innerText = currentData.title;
            const img = document.getElementById('charImg');
            if (!img.src.includes(currentData.img)) img.src = currentData.img;

            let prevXP = 0;
            if (gameState.level > 1) prevXP = thresholds[gameState.level - 1].xp;
            
            let percentage = 0;
            if (gameState.level < 15) {
                let nextLevelXP = thresholds[gameState.level].xp;
                percentage = ((gameState.totalXP - prevXP) / (nextLevelXP - prevXP)) * 100;
                document.getElementById('progressText').innerText = `下一階: ${nextLevelXP - gameState.totalXP}`;
            } else {
                percentage = 100;
                document.getElementById('progressText').innerText = "MAX RANK";
            }
            document.getElementById('progressBar').style.width = Math.min(percentage, 100) + '%';
        }

        function updateButtonLabels() {
            const bases = [10, 30, 50, 150, 400, 4000];
            const totalMult = 1 + weatherMultiplier + timeMultiplier + streakMultiplier;

            bases.forEach(base => {
                const final = Math.floor(base * totalMult);
                const el = document.getElementById(`xp-${base}`);
                if (base === 4000) {
                     if (totalMult > 1) { el.innerText = `LEGEND +${final} (Buff)`; el.style.color = "#000"; }
                     else { el.innerText = `LEGEND +${base}`; el.style.color = "#000"; }
                } else {
                    if (totalMult > 1) { el.innerText = `+${final} (Buff)`; el.style.color = "#FFD700"; }
                    else { el.innerText = `+${base} XP`; el.style.color = "white"; }
                }
            });
        }

        function requestReset() { if(confirm("【警告】結束賽季？\n確認後將顯示結算表並清除檔案。")) showSeasonEndSummary(); }

        function showSeasonEndSummary() {
            document.getElementById('season-date-range').innerText = `${gameState.seasonStartDate} ~ ${new Date().toLocaleDateString()}`;
            document.getElementById('season-rank').innerText = thresholds[gameState.level].title;
            document.getElementById('season-xp').innerText = gameState.totalXP;
            document.getElementById('season-streak').innerText = `${gameState.streakDays} 天`;
            
            // 填入賽季統計行動數據
            const sStats = gameState.seasonStats || { explore: 0, block: 0, target: 0, contract: 0, dungeon: 0, recruit: 0 };
            document.getElementById('season-explore').innerText = sStats.explore;
            document.getElementById('season-block').innerText = sStats.block;
            document.getElementById('season-target').innerText = sStats.target;
            document.getElementById('season-contract').innerText = sStats.contract;
            document.getElementById('season-dungeon').innerText = sStats.dungeon;
            document.getElementById('season-recruit').innerText = sStats.recruit;

            const list = document.getElementById('seasonAchList');
            list.innerHTML = "";
            const stats = gameState.lifetimeStats;
            const sortedKeys = Object.keys(stats).sort((a,b) => stats[b] - stats[a]);
            if (sortedKeys.length === 0) list.innerHTML = "<div style='color:#777; text-align:center;'>無特殊成就</div>";
            else sortedKeys.forEach(key => {
                const row = document.createElement('div');
                row.className = "list-row";
                row.innerHTML = `<span class="list-label">${key}</span><span class="list-val">${stats[key]}次</span>`;
                list.appendChild(row);
            });
            document.getElementById('seasonEndModal').style.display = 'flex';
        }

        function finalWipe() { localStorage.removeItem('salesRPG_v7_save'); location.reload(); }

        function getDailyAchievements() {
            const stats = gameState.dailyStats;
            const bigWins = stats.contract + stats.dungeon;
            let achs = [];
            if (stats.recruit >= 1) achs.push({name: "👑 王者降臨", class: "ore-star"});
            if (stats.maxStreak >= 5) achs.push({name: "🎯 彈無虛發-白金", class: "ore-star"});
            else if (stats.maxStreak >= 4) achs.push({name: "🎯 彈無虛發-金牌", class: "ore-gold"});
            else if (stats.maxStreak >= 3) achs.push({name: "🎯 彈無虛發-銀牌", class: "ore-iron"});
            else if (stats.maxStreak >= 2) achs.push({name: "🎯 彈無虛發-銅牌", class: "ore-iron"});
            if (bigWins >= 3) achs.push({name: "🌏 三千世界", class: "ore-star"});
            else if (bigWins === 2) achs.push({name: "🚩 旗開得勝", class: "ore-gold"});
            else if (bigWins === 1) achs.push({name: "🎋 勢如破竹", class: "ore-iron"});
            if (bigWins === 0 && stats.target >= 1) achs.push({name: "🏰 聚沙成塔", class: "ore-iron"});
            
            const t = stats.target;
            if (t >= 10) achs.push({name: "💎 礦脈：星辰石", class: "ore-star"});
            else if (t >= 8) achs.push({name: "💎 礦脈：鑽石", class: "ore-diamond"});
            else if (t >= 6) achs.push({name: "💎 礦脈：白金", class: "ore-diamond"});
            else if (t >= 5) achs.push({name: "💎 礦脈：金礦", class: "ore-gold"});
            else if (t >= 3) achs.push({name: "💎 礦脈：銅礦", class: "ore-iron"});
            if (stats.block >= 5) achs.push({name: "🛡️ 守護之盾", class: "ore-iron"});

            const potentialStreak = (bigWins >= 1) ? gameState.streakDays + 1 : 0;
            if (potentialStreak >= 2) achs.push({name: "🔥 小試身手 (連2天)", class: "ore-iron"});
            if (potentialStreak >= 3) achs.push({name: "🔥 手到擒來 (連3天)", class: "ore-iron"});
            if (potentialStreak >= 4) achs.push({name: "🔥 一塊蛋糕 (連4天)", class: "ore-gold"});
            if (potentialStreak >= 5) achs.push({name: "🔥 無人之境 (連5天)", class: "ore-gold"});
            if (potentialStreak >= 6) achs.push({name: "🔥 GOD LIKE (連6天)", class: "ore-star"});
            if (potentialStreak >= 7) achs.push({name: "🔥 John Wick (連7天+)", class: "ore-star"});
            return achs;
        }

        function showSettlement() {
            const stats = gameState.dailyStats;
            const bigWins = stats.contract + stats.dungeon;
            document.getElementById('rep-explore').innerText = stats.explore;
            document.getElementById('rep-block').innerText = stats.block;
            document.getElementById('rep-target').innerText = stats.target;
            document.getElementById('rep-contract').innerText = stats.contract; // 新增
            document.getElementById('rep-dungeon').innerText = stats.dungeon;   // 新增
            document.getElementById('rep-recruit').innerText = stats.recruit;
            document.getElementById('rep-xp').innerText = gameState.dailyXP;
            const statusEl = document.getElementById('rep-streak-status');
            if (bigWins >= 1) { statusEl.innerText = `達成！連勝將延續至 ${gameState.streakDays + 1} 天`; statusEl.style.color = "#4cd137"; } 
            else { statusEl.innerText = "未達成，連勝將歸零"; statusEl.style.color = "#e74c3c"; }
            const list = document.getElementById('achList'); list.innerHTML = "";
            const achs = getDailyAchievements();
            if (achs.length === 0) list.innerHTML = "<div style='color:#777'>無成就</div>";
            achs.forEach(ach => {
                const div = document.createElement('div'); div.className = `ach-item ${ach.class}`; div.innerText = ach.name; list.appendChild(div);
            });
            document.getElementById('reportModal').style.display = 'flex';
        }

        function resetDayAndClose() {
            if(!confirm("確定要結束今天？")) return;
            const achs = getDailyAchievements();
            achs.forEach(ach => {
                const key = ach.name; if (!gameState.lifetimeStats[key]) gameState.lifetimeStats[key] = 0; gameState.lifetimeStats[key]++;
            });
            
            // 累積數據到賽季統計
            const d = gameState.dailyStats;
            if(!gameState.seasonStats) gameState.seasonStats = { explore: 0, block: 0, target: 0, contract: 0, dungeon: 0, recruit: 0 };
            gameState.seasonStats.explore += d.explore;
            gameState.seasonStats.block += d.block;
            gameState.seasonStats.target += d.target;
            gameState.seasonStats.contract += d.contract;
            gameState.seasonStats.dungeon += d.dungeon;
            gameState.seasonStats.recruit += d.recruit;

            const bigWins = d.contract + d.dungeon;
            if (bigWins >= 1) gameState.streakDays++; else gameState.streakDays = 0;
            resetDailyStats(); gameState.lastLogin = new Date().toDateString(); saveGame(); calculateMultipliers(); updateUI();
            document.getElementById('reportModal').style.display = 'none';
        }

        function showLifetimeStats() {
            const list = document.getElementById('lifetimeList'); list.innerHTML = "";
            const stats = gameState.lifetimeStats;
            const sortedKeys = Object.keys(stats).sort((a,b) => stats[b] - stats[a]);
            if (sortedKeys.length === 0) list.innerHTML = "<div style='color:#777; text-align:center'>尚無記錄</div>";
            else sortedKeys.forEach(key => {
                const row = document.createElement('div'); row.className = "list-row";
                row.innerHTML = `<span class="list-label">${key}</span><span class="list-val">${stats[key]}次</span>`; list.appendChild(row);
            });
            document.getElementById('statsModal').style.display = 'flex';
        }

        function undoLastAction() {
            if (historyStack.length === 0) return alert("無法復原");
            if (confirm("復原上一步？")) { gameState = historyStack.pop(); saveGame(); updateUI(); }
        }
        function saveGame() { localStorage.setItem('salesRPG_v7_save', JSON.stringify(gameState)); }
        function initWeather() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    try {
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${position.coords.latitude}&longitude=${position.coords.longitude}&current=apparent_temperature,rain,showers`;
                        const res = await fetch(url); const data = await res.json();
                        const rain = (data.current.rain || 0) + (data.current.showers || 0);
                        calcWeather(data.current.apparent_temperature, rain);
                    } catch (e) { document.getElementById('buff-weather').innerText = "📡 氣象離線"; }
                }, () => { document.getElementById('buff-weather').innerText = "📡 定位未開"; });
            }
        }
        function calcWeather(temp, rain) {
            let bonus = 0; let label = "舒適";
            if (temp > 30) { bonus += 0.2; label="🔥酷熱"; } else if (temp >= 28) { bonus += 0.1; label="😡炎熱"; }
            else if (temp < 10) { bonus += 0.2; label="🥶嚴寒"; } else if (temp <= 15) { bonus += 0.1; label="🤧寒冷"; }
            if (rain > 2.0) { bonus += 0.1; label+="⛈️"; } else if (rain > 0.1) { bonus += 0.05; label+="🌧️"; }
            weatherMultiplier = bonus;
            const wBadge = document.getElementById('buff-weather');
            if (bonus > 0) { wBadge.classList.add('buff-active'); wBadge.innerText = `📡 ${label} (+${Math.round(bonus*100)}%)`; }
            else { wBadge.classList.remove('buff-active'); wBadge.innerText = `📡 ${label} (無加成)`; }
            calculateMultipliers();
        }
        function refreshWeather() { document.getElementById('buff-weather').innerText = "更新中..."; initWeather(); }

        init();
    </script>
</body>
</html>
